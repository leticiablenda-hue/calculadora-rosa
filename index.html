<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#d81b60" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Calculadora Rosa" />
  <title>Calculadora Rosa</title>
  <style>
    :root {
      --bg-page: #fce4ec;
      --bg-calc: #fff0f5;
      --bg-display: #f8bbd0;
      --border-strong: #ad1457;
      --border-soft: #f48fb1;
      --btn-num: #ffffff;
      --btn-num-hover: #fce4ec;
      --btn-op: #f06292;
      --btn-op-text: #ffffff;
      --btn-func: #f8bbd0;
      --btn-equal: #c2185b;
      --text-main: #4a0e2e;
      --text-muted: #880e4f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
      padding: 12px;
    }

    .app-shell {
      width: 100%;
      max-width: 400px;
      background-color: var(--bg-calc);
      border: 3px solid var(--border-strong);
      box-shadow: 8px 8px 0px var(--border-strong);
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      background-color: var(--border-strong);
      color: #ffffff;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .bar-btn {
      background: #ffffff;
      color: var(--border-strong);
      border: 2px solid #ffffff;
      padding: 4px 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
    }

    .bar-btn:active {
      background: var(--bg-display);
    }

    #installBtn {
      display: none;
    }

    .display-area {
      background-color: var(--bg-display);
      border-bottom: 3px solid var(--border-strong);
      padding: 18px 16px;
      text-align: right;
      min-height: 125px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      word-break: break-all;
    }

    .expression {
      font-size: 1rem;
      color: var(--text-muted);
      min-height: 24px;
      font-weight: 600;
    }

    .current-value {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.1;
    }

    .history-drawer {
      display: none;
      background-color: #ffffff;
      border-bottom: 3px solid var(--border-strong);
      max-height: 180px;
      overflow-y: auto;
      padding: 10px 14px;
    }

    .history-drawer.open {
      display: block;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .clear-hist-btn {
      background: none;
      border: 1px solid var(--border-strong);
      color: var(--border-strong);
      padding: 2px 6px;
      font-size: 0.7rem;
      cursor: pointer;
      font-weight: 700;
    }

    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .history-item {
      padding: 6px 8px;
      background-color: var(--bg-calc);
      border-left: 3px solid var(--border-strong);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
    }

    .history-item:hover {
      background-color: var(--bg-display);
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2px;
      background-color: var(--border-strong);
    }

    button.key {
      border: none;
      padding: 20px 10px;
      font-size: 1.35rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.08s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button.key:active {
      filter: brightness(0.92);
    }

    .key-num {
      background-color: var(--btn-num);
      color: var(--text-main);
    }

    .key-num:hover {
      background-color: var(--btn-num-hover);
    }

    .key-func {
      background-color: var(--btn-func);
      color: var(--text-main);
    }

    .key-op {
      background-color: var(--btn-op);
      color: var(--btn-op-text);
    }

    .key-equal {
      background-color: var(--btn-equal);
      color: #ffffff;
    }
  </style>
</head>
<body>

  <main class="app-shell">
    <header class="top-bar">
      <span>Calc Rosa</span>
      <div class="top-actions">
        <button class="bar-btn" id="installBtn">Instalar App</button>
        <button class="bar-btn" id="toggleHistoryBtn">Histórico</button>
      </div>
    </header>

    <section class="history-drawer" id="historyDrawer">
      <div class="history-header">
        <span>Últimos cálculos</span>
        <button class="clear-hist-btn" id="clearHistoryBtn">Limpar</button>
      </div>
      <ul class="history-list" id="historyList"></ul>
    </section>

    <section class="display-area">
      <div class="expression" id="expressionDisplay"></div>
      <div class="current-value" id="currentDisplay">0</div>
    </section>

    <section class="keypad">
      <button class="key key-func" data-action="clear">AC</button>
      <button class="key key-func" data-action="backspace">⌫</button>
      <button class="key key-func" data-action="percent">%</button>
      <button class="key key-op" data-op="/">÷</button>

      <button class="key key-num" data-num="7">7</button>
      <button class="key key-num" data-num="8">8</button>
      <button class="key key-num" data-num="9">9</button>
      <button class="key key-op" data-op="*">×</button>

      <button class="key key-num" data-num="4">4</button>
      <button class="key key-num" data-num="5">5</button>
      <button class="key key-num" data-num="6">6</button>
      <button class="key key-op" data-op="-">−</button>

      <button class="key key-num" data-num="1">1</button>
      <button class="key key-num" data-num="2">2</button>
      <button class="key key-num" data-num="3">3</button>
      <button class="key key-op" data-op="+">+</button>

      <button class="key key-func" data-action="sign">±</button>
      <button class="key key-num" data-num="0">0</button>
      <button class="key key-num" data-action="decimal">,</button>
      <button class="key key-equal" data-action="calculate">=</button>
    </section>
  </main>

  <script>
    // --- Lógica da Calculadora ---
    const currentDisplay = document.getElementById('currentDisplay');
    const expressionDisplay = document.getElementById('expressionDisplay');
    const historyDrawer = document.getElementById('historyDrawer');
    const historyList = document.getElementById('historyList');
    const toggleHistoryBtn = document.getElementById('toggleHistoryBtn');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');

    let currentInput = '0';
    let previousInput = '';
    let operator = null;
    let shouldResetScreen = false;
    let history = JSON.parse(localStorage.getItem('calc_rosa_history') || '[]');

    function formatNumber(numStr) {
      if (numStr === 'Erro') return 'Erro';
      const [intPart, decPart] = numStr.split('.');
      const formattedInt = Number(intPart).toLocaleString('pt-BR');
      return decPart !== undefined ? `${formattedInt},${decPart}` : formattedInt;
    }

    function updateDisplay() {
      currentDisplay.textContent = formatNumber(currentInput);
      const opSymbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };
      if (operator && previousInput !== '') {
        expressionDisplay.textContent = `${formatNumber(previousInput)} ${opSymbols[operator]}`;
      } else {
        expressionDisplay.textContent = '';
      }
    }

    function appendNumber(num) {
      if (currentInput === 'Erro') currentInput = '0';
      if (currentInput === '0' || shouldResetScreen) {
        currentInput = num;
        shouldResetScreen = false;
      } else {
        if (currentInput.replace('-', '').length < 15) {
          currentInput += num;
        }
      }
      updateDisplay();
    }

    function appendDecimal() {
      if (shouldResetScreen) {
        currentInput = '0.';
        shouldResetScreen = false;
        updateDisplay();
        return;
      }
      if (!currentInput.includes('.')) {
        currentInput += '.';
        updateDisplay();
      }
    }

    function chooseOperator(op) {
      if (currentInput === 'Erro') return;
      if (operator !== null && !shouldResetScreen) {
        calculate();
      }
      previousInput = currentInput;
      operator = op;
      shouldResetScreen = true;
      updateDisplay();
    }

    function calculate() {
      if (operator === null || shouldResetScreen) return;
      const prev = parseFloat(previousInput);
      const curr = parseFloat(currentInput);
      let result;

      switch (operator) {
        case '+': result = prev + curr; break;
        case '-': result = prev - curr; break;
        case '*': result = prev * curr; break;
        case '/':
          if (curr === 0) {
            currentInput = 'Erro';
            operator = null;
            previousInput = '';
            updateDisplay();
            return;
          }
          result = prev / curr;
          break;
      }

      result = Math.round(result * 1e10) / 1e10;
      const opSymbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };
      const record = `${formatNumber(previousInput)} ${opSymbols[operator]} ${formatNumber(currentInput)} = ${formatNumber(String(result))}`;
      addHistory(record, String(result));

      currentInput = String(result);
      operator = null;
      previousInput = '';
      shouldResetScreen = true;
      updateDisplay();
    }

    function applyPercent() {
      if (currentInput === 'Erro') return;
      const curr = parseFloat(currentInput);
      if (previousInput && (operator === '+' || operator === '-')) {
        currentInput = String((parseFloat(previousInput) * curr) / 100);
      } else {
        currentInput = String(curr / 100);
      }
      updateDisplay();
    }

    function toggleSign() {
      if (currentInput === '0' || currentInput === 'Erro') return;
      currentInput = currentInput.startsWith('-') ? currentInput.slice(1) : '-' + currentInput;
      updateDisplay();
    }

    function clearAll() {
      currentInput = '0';
      previousInput = '';
      operator = null;
      shouldResetScreen = false;
      updateDisplay();
    }

    function backspace() {
      if (shouldResetScreen || currentInput === 'Erro') {
        clearAll();
        return;
      }
      currentInput = currentInput.length > 1 ? currentInput.slice(0, -1) : '0';
      if (currentInput === '-') currentInput = '0';
      updateDisplay();
    }

    function addHistory(text, rawResult) {
      history.unshift({ text, rawResult });
      if (history.length > 15) history.pop();
      localStorage.setItem('calc_rosa_history', JSON.stringify(history));
      renderHistory();
    }

    function renderHistory() {
      historyList.innerHTML = '';
      if (history.length === 0) {
        historyList.innerHTML = '<li style="font-size:0.8rem;color:#880e4f;">Nenhuma conta salva.</li>';
        return;
      }
      history.forEach(item => {
        const li = document.createElement('li');
        li.className = 'history-item';
        li.textContent = item.text;
        li.onclick = () => {
          currentInput = item.rawResult;
          shouldResetScreen = true;
          updateDisplay();
          historyDrawer.classList.remove('open');
        };
        historyList.appendChild(li);
      });
    }

    document.querySelectorAll('.key').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.dataset.num) appendNumber(btn.dataset.num);
        else if (btn.dataset.op) chooseOperator(btn.dataset.op);
        else if (btn.dataset.action === 'decimal') appendDecimal();
        else if (btn.dataset.action === 'calculate') calculate();
        else if (btn.dataset.action === 'clear') clearAll();
        else if (btn.dataset.action === 'backspace') backspace();
        else if (btn.dataset.action === 'percent') applyPercent();
        else if (btn.dataset.action === 'sign') toggleSign();
      });
    });

    document.addEventListener('keydown', e => {
      if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
      else if (e.key === '.' || e.key === ',') appendDecimal();
      else if (['+', '-', '*', '/'].includes(e.key)) chooseOperator(e.key);
      else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); calculate(); }
      else if (e.key === 'Backspace') backspace();
      else if (e.key === 'Escape') clearAll();
      else if (e.key === '%') applyPercent();
    });

    toggleHistoryBtn.addEventListener('click', () => {
      historyDrawer.classList.toggle('open');
    });

    clearHistoryBtn.addEventListener('click', () => {
      history = [];
      localStorage.removeItem('calc_rosa_history');
      renderHistory();
    });

    renderHistory();

    // --- Configuração Automática de PWA (Ícone + Manifest + Offline) ---
    function setupPWA() {
      // 1. Gera ícone PNG quadrado em rosa via Canvas
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#d81b60';
      ctx.fillRect(0, 0, 512, 512);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 24;
      ctx.strokeRect(48, 48, 416, 416);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 160px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('+=', 256, 265);
      const iconDataUrl = canvas.toDataURL('image/png');

      // 2. Cria o Web App Manifest dinamicamente
      const manifest = {
        name: 'Calculadora Rosa',
        short_name: 'Calc Rosa',
        start_url: './',
        display: 'standalone',
        background_color: '#fce4ec',
        theme_color: '#d81b60',
        icons: [
          { src: iconDataUrl, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
        ]
      };
      const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
      const manifestUrl = URL.createObjectURL(manifestBlob);
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = manifestUrl;
      document.head.appendChild(link);

      // 3. Registra Service Worker em memória (para funcionar offline via HTTPS)
      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        const swCode = `
          const CACHE = 'calc-rosa-v1';
          self.addEventListener('install', e => {
            e.waitUntil(caches.open(CACHE).then(c => c.addAll(['./'])));
            self.skipWaiting();
          });
          self.addEventListener('fetch', e => {
            e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
          });
        `;
        const swBlob = new Blob([swCode], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
      }
    }

    setupPWA();

    // Botão nativo de instalação (aparece quando hospedado em HTTPS)
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'inline-block';
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.style.display = 'none';
    });
  </script>
</body>
</html>
